x-backend-environment: &backend-environment
  FFMPEG_LOCATION: ""
  TEMP_DIR: /tmp/videolens
  REDIS_URL: redis://redis:6379/0
  S3_ENDPOINT_URL: http://minio:9000
  S3_REGION: us-east-1
  S3_BUCKET: videolens
  S3_ACCESS_KEY_ID: videolens
  S3_SECRET_ACCESS_KEY: videolens-development
  ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3005

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment: *backend-environment
    depends_on:
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  worker:
    build: ./backend
    command: ["python", "-m", "arq", "app.worker.WorkerSettings"]
    env_file:
      - ./backend/.env
    environment: *backend-environment
    depends_on:
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: videolens
      MINIO_ROOT_PASSWORD: videolens-development
    ports:
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "until mc alias set local http://minio:9000 videolens videolens-development;
      do sleep 2; done; mc mb --ignore-existing local/videolens"

volumes:
  redis_data:
  minio_data:
