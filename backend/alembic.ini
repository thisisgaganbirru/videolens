# Alembic configuration for the identity schema (accounts, workspaces,
# workspace_members, api_keys). Run from `backend/` as a release step:
#
#     DATABASE_URL=postgresql://... alembic upgrade head
#
# The URL comes from DATABASE_URL (environment, else backend/.env); the value
# below is only a placeholder so the CLI parses this file without one.
[alembic]
script_location = migrations
path_separator = os
prepend_sys_path = .
sqlalchemy.url = sqlite+aiosqlite:///./videolens-dev.sqlite3

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
