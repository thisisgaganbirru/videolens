services:
  - type: web
    name: videolens-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: MAX_FILE_SIZE_MB
        value: "200"
      - key: MAX_DURATION_SECONDS
        value: "180"
      - key: RATE_LIMIT_PER_HOUR
        value: "20"
      - key: RUN_TTL_SECONDS
        value: "3600"
      - key: ALLOWED_ORIGINS
        sync: false

  - type: web
    name: videolens-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false
