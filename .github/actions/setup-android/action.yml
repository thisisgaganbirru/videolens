name: Set up Android toolchain
description: >-
  JDK 21 with the Gradle cache and the pinned Android SDK packages. Run after
  setup-frontend: the Android build needs the web bundle first.

runs:
  using: composite
  steps:
    - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
      with:
        distribution: temurin
        java-version: "21"
        cache: gradle
    # v4.0.2+ is required. v3.x defaults its `packages` input to
    # "tools platform-tools", and Google removed the long-deprecated `tools`
    # package from the SDK repository in Sep 2026, so v3 fails inside its own
    # setup with "Failed to find package 'tools'" before the sdkmanager line
    # below ever runs. v4 defaults to "platform-tools" only (and runs on Node 24).
    - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
    - name: Install Android SDK packages
      shell: bash
      run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
