version: 2
updates:
  # Docker ecosystem coverage is NOT uniform across these three directories.
  # Dependabot's Dockerfile parser matches literal `FROM image:tag@sha256:...`
  # references. Both application Dockerfiles now declare their base image once,
  # through a global `ARG` (`FROM ${PYTHON_IMAGE}` / `FROM ${NODE_IMAGE}`), so
  # the literal no longer sits on the FROM line.
  #
  # These two entries are kept deliberately rather than deleted:
  #   - if Dependabot does resolve an ARG default, coverage continues unchanged;
  #   - if it does not, they are inert, and they resume working the moment
  #     anyone reverts to a literal FROM without needing to remember this file.
  # Either way the runtime majors are upgraded manually and deliberately — see
  # docs/container-workflows.md, "Runtime versions". Do not treat a silent
  # Dependabot as evidence the base images are current.
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
  # `docker-compose`, not `docker`. The intent has always been the literal
  # digests docker-compose.yml pins for redis, minio/minio and minio/mc - but
  # the `docker` ecosystem scans Dockerfiles and Kubernetes YAML, not compose
  # files, and there is no Dockerfile at the repo root. So every run failed
  # with `dependency_file_not_found: No Dockerfiles nor Kubernetes YAML found
  # in /`, and nothing was ever bumped.
  #
  # A failing scheduled job is not cosmetic here. Railway's Wait for CI skips a
  # deploy when *any* workflow on the commit failed, including Dependabot's, so
  # this silently blocked production - see docs/railway-environments.md.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
