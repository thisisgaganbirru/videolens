name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app
      - run: python -m unittest discover -s tests
      - run: python -c "import app.main; import app.worker"
        env:
          GEMINI_API_KEY: ci-test-key

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm run build:mobile

  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci
      - run: npm run android:sync
      - id: version
        run: |
          echo "name=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - run: |
          ./gradlew assembleDebug testDebugUnitTest \
            -PappVersionName=${{ steps.version.outputs.name }} \
            -PappVersionCode=${{ github.run_number }} \
            -PbuildRef=${{ steps.version.outputs.sha }}
        working-directory: frontend/android
      - uses: actions/upload-artifact@v4
        with:
          name: videolens-ai-v${{ steps.version.outputs.name }}-code${{ github.run_number }}-${{ steps.version.outputs.sha }}-debug
          path: frontend/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
      - name: Write version manifest
        # Read by the app's in-app update check (frontend/lib/updateCheck.ts).
        # A separate JSON asset instead of parsing the release tag string, so
        # the app doesn't depend on the tag naming scheme staying stable.
        run: |
          cat > android/app/build/outputs/apk/debug/version.json <<JSON
          {
            "versionCode": ${{ github.run_number }},
            "versionName": "${{ steps.version.outputs.name }}",
            "commit": "${{ steps.version.outputs.sha }}",
            "releaseUrl": "https://github.com/${{ github.repository }}/releases/tag/dev-v${{ steps.version.outputs.name }}-build${{ github.run_number }}"
          }
          JSON
      - name: Publish dev release
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-v${{ steps.version.outputs.name }}-build${{ github.run_number }}
          name: VideoLens AI dev build v${{ steps.version.outputs.name }} (#${{ github.run_number }})
          prerelease: true
          files: |
            frontend/android/app/build/outputs/apk/debug/*.apk
            frontend/android/app/build/outputs/apk/debug/version.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Update release manifest
        # The repo is private, so the in-app "Releases" tab can't call
        # GitHub's API from the browser (unauthenticated calls 404, and a
        # token can't safely live in client-side JS). Instead, this job -
        # which just published the release above using the ambient,
        # zero-setup token every Actions run already gets - also updates a
        # static frontend/public/releases.json and commits it straight to
        # dev. The frontend then reads that as a same-origin static file
        # (see frontend/infrastructure/versionLogGateway.ts). No credential
        # of any kind is introduced for this.
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        working-directory: frontend
        env:
          RELEASE_NAME: VideoLens AI dev build v${{ steps.version.outputs.name }} (#${{ github.run_number }})
          RELEASE_TAG: dev-v${{ steps.version.outputs.name }}-build${{ github.run_number }}
        run: |
          export RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${RELEASE_TAG}"
          export PUBLISHED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          node <<'NODE'
          const fs = require("fs");
          const path = "public/releases.json";
          const entry = {
            name: process.env.RELEASE_NAME,
            tag: process.env.RELEASE_TAG,
            publishedAt: process.env.PUBLISHED_AT,
            url: process.env.RELEASE_URL,
          };
          const manifest = fs.existsSync(path) ? JSON.parse(fs.readFileSync(path, "utf8")) : { releases: [] };
          const releases = manifest.releases.filter((release) => release.tag !== entry.tag);
          releases.unshift(entry);
          releases.sort((a, b) => new Date(b.publishedAt) - new Date(a.publishedAt));
          fs.writeFileSync(path, JSON.stringify({ releases: releases.slice(0, 20) }, null, 2) + "\n");
          NODE
      - name: Commit release manifest
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        run: |
          if git diff --quiet -- frontend/public/releases.json; then
            echo "No manifest changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/releases.json
          git commit -m "Update release manifest for v${{ steps.version.outputs.name }} build ${{ github.run_number }} [skip ci]"
          for attempt in 1 2 3; do
            if git push origin HEAD:dev; then
              exit 0
            fi
            echo "Push rejected, rebasing onto latest dev (attempt $attempt)..."
            git fetch origin dev
            git rebase origin/dev
          done
          echo "Could not push the release manifest after 3 attempts." >&2
          exit 1
