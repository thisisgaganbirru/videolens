name: Production environment

# The production lane, in two halves.
#
# Pull request into main (the promotion from `dev`, or a `hotfix/*` branch;
# nothing else, see `source-branch`): application checks in full, and the
# security scan ENFORCED. A fixable high or critical finding fails
# `production-required`, so it cannot merge. This is the only place security
# is mandatory before code reaches main.
#
# The aggregate check is `production-required`, and the dev lane's is
# `dev-required` (both renamed from `required`, 2026-11-26). With one
# shared name, a PR first opened into dev and then retargeted to main fires
# only `edited`, which this lane does not listen to, and the
# dev lane's green check on the same head commit would
# satisfy main's ruleset without this lane ever running. main's ruleset
# requires `production-required` and dev's requires `dev-required`; renaming
# either job means changing its ruleset in the same breath
# (docs/engineering-standards.md, "Branch protection").
#
# Push to main (the merge): the checks above are not repeated - with
# "Require branches to be up to date before merging" on, the merge commit is
# the tree the PR just tested. Instead it does what only the merge can:
#   publish  -> build each image once, scan that exact image (enforced again,
#               so a CVE published between PR and merge still cannot ship),
#               then promote it to `latest`
#   android  -> the APK with the production backend URL compiled in
#   release  -> the GitHub Release, only once both of the above passed
# Railway's Wait for CI holds the production deploy until this run is green.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A PR's runs cancel each other. Runs on main never cancel a run that is
  # already in progress, so a started merge run is published and released in
  # full. They are still one concurrency group, though: GitHub keeps at most
  # one run pending per group, so when a third main run queues behind a
  # running one, the run that was pending is cancelled. That merge then gets
  # no image, APK or release of its own; the newer merge's run ships its
  # changes too.
  group: ${{ github.event_name == 'pull_request' && format('production-pr-{0}', github.event.pull_request.number) || 'production-environment' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # --- Pull request into main -------------------------------------------

  application:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/reusable-application-checks.yml

  security:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/reusable-security-scan.yml
    with:
      enforce: true

  # No AI-tool attribution in the PR's commits or description.
  hygiene:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/reusable-commit-hygiene.yml
    permissions:
      contents: read
      pull-requests: read

  # main only takes the promotion from `dev` and hotfixes from `hotfix/*`
  # (owner decision, 2026-11-26), and only from branches of this repository.
  # A guard against mistakes, not a security boundary: like every job here it
  # runs from the PR's own tree, so a PR that edits this file can change it,
  # and a PR retargeted to main after its last push is not re-run (only
  # `edited` fires). `.github/` changes need the owner's review.
  source-branch:
    name: Source branch
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: The PR comes from dev or a hotfix/* branch of this repository
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          echo "Head: ${HEAD_REPO:-<deleted repository>}:${HEAD_REF}"
          if [ "$HEAD_REPO" != "$THIS_REPO" ]; then
            echo "::error::Pull requests into main must come from a branch of ${THIS_REPO}, not from '${HEAD_REPO:-a deleted fork}'. Open the PR into dev instead."
            exit 1
          fi
          case "$HEAD_REF" in
            dev | hotfix/?*) ;;
            *)
              echo "::error::Pull requests into main must come from 'dev' (a promotion) or a 'hotfix/*' branch, not '${HEAD_REF}'. Open the PR into dev, or rename the branch hotfix/<name> if this is a hotfix (merge main back into dev afterwards)."
              exit 1
              ;;
          esac

  production-required:
    name: production-required
    if: always() && github.event_name == 'pull_request'
    needs: [source-branch, application, security, hygiene]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Source branch, application checks, the security scan and commit hygiene passed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "Job results: ${RESULTS}"
          # Stricter than the dev gate: nothing here is path-filtered, so a
          # skipped job is as wrong as a failed one.
          if jq -e 'any(.[]; . != "success")' <<<"$RESULTS" >/dev/null; then
            echo "::error::The promotion needs every check green, including the security scan."
            exit 1
          fi

  # --- Push to main ------------------------------------------------------

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/reusable-container-publish.yml
    with:
      environment: production
      channel: latest
      revision: ${{ github.sha }}
    # No secrets: the publish job's only credential is its own github.token,
    # and environment secrets of `production` reach it through its
    # `environment:` regardless. `secrets: inherit` used to hand it every
    # repository secret, the ANDROID_* signing key included.

  android:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/reusable-android-checks.yml
    # No secrets passed. The release signing key lives in the `production`
    # GitHub environment (deployment branches: main only), and the reusable's
    # two signing jobs run in the environment named below, so only a run on
    # main can read it; a repository secret would reach any branch's workflow.
    # The dev lane passes no environment and builds the debug variant with the
    # checked-in keystore. Until all four secrets exist this lane ships the
    # debug-signed APK with a warning (none set) or fails (some set); see
    # DEPLOYMENT.md, "Android release signing".
    with:
      upload_apk: true
      environment: production
      # The production backend, matching the image this same workflow publishes.
      # This APK is installed on real devices, so it cannot fall back to
      # localhost - and it must not point at dev, whose Redis, quota and stored
      # runs are a different environment entirely.
      api_base_url: https://videolens-backend-production.up.railway.app

  release:
    name: Publish release
    # workflow_dispatch builds, scans and publishes images but deliberately
    # creates no release.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # The APK is what people actually install, so it does not ship unless the
    # images for the same commit passed the enforced security scan.
    needs: [android, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One of only two jobs holding contents: write; the other is the
    # Dependabot auto-merge job (owner's decision, 2026-11-07). Keep it that
    # way: everything else, including the Android build itself, is read-only.
    permissions:
      contents: write
    env:
      RELEASE_NAME: VideoLens AI v${{ needs.android.outputs.version_name }} (build ${{ needs.android.outputs.version_code }})
      # Built by the Android job alongside the version.json inside the APK
      # bundle, so the manifest the installed app reads and the tag it links to
      # cannot disagree.
      RELEASE_TAG: ${{ needs.android.outputs.release_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.android.outputs.artifact_name }}
          path: release-assets
      - name: Publish release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          # Pins the tag to the exact commit the APK was built from rather than
          # to wherever main's tip has since moved. This shipped broken once,
          # when releases ran on dev and the tag landed on main instead.
          target_commitish: ${{ github.sha }}
          name: ${{ env.RELEASE_NAME }}
          # GitHub builds the body from PRs merged since the previous tag.
          generate_release_notes: true
          prerelease: false
          files: |
            release-assets/*.apk
            release-assets/version.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
