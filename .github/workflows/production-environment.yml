name: Production environment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production-environment
  cancel-in-progress: false

jobs:
  application:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/reusable-application-checks.yml
  containers:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/reusable-container-checks.yml
  android:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/reusable-android-checks.yml
  publish:
    if: github.ref == 'refs/heads/main'
    needs: [application, containers]
    uses: ./.github/workflows/reusable-container-publish.yml
    with:
      environment: production
      channel: latest
      revision: ${{ github.sha }}
    secrets: inherit
