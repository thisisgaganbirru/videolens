name: Reusable application checks

on:
  workflow_call:
    inputs:
      backend:
        description: Run the backend job. Callers pass false when a change touches no backend files.
        required: false
        default: true
        type: boolean
      frontend:
        description: Run the frontend job. Callers pass false when a change touches no frontend files.
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    if: inputs.backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check Python version pins agree
        # /.python-version is the single source of truth for the Python major.
        # backend/Dockerfile repeats it twice (the digest-pinned `FROM python:`
        # line of the `base` stage, and the ensurepip path, which silently stops
        # removing anything if it goes stale). Nothing else would catch either
        # drifting, so fail here.
        working-directory: ${{ github.workspace }}
        run: |
          want="$(tr -d '[:space:]' < .python-version)"
          image="$(sed -n 's/^FROM python:\([0-9]*\.[0-9]*\)-slim@.*/\1/p' backend/Dockerfile)"
          ensurepip="$(sed -n 's|.*/usr/local/lib/python\([0-9]*\.[0-9]*\)/ensurepip.*|\1|p' backend/Dockerfile)"
          for got in "$image" "$ensurepip"; do
            if [ "$want" != "$got" ]; then
              echo "::error::.python-version is '${want}' but backend/Dockerfile has FROM python:'${image}', ensurepip='${ensurepip}'"
              exit 1
            fi
          done
          echo "Python pin agrees everywhere: ${want}"
      - uses: ./.github/actions/setup-backend
      - name: Check requirements.txt kept its environment markers
        # requirements.txt is `uv pip compile --universal` output: a single
        # lock for every platform, with PEP 508 markers on the packages that
        # differ (uvloop is Linux/macOS only, cffi/pycparser skip PyPy). A
        # regeneration with plain pip-compile resolves for the runner's own
        # platform and silently drops every marker; Linux CI and Docker never
        # notice, but `pip install` on Windows then fails building uvloop.
        # Dependabot's #95 (2026-11-06) did exactly that. Fail here so the next
        # such PR goes red instead of shipping a Linux-only lock.
        run: |
          if ! grep -qE "^uvloop==.* ; .*sys_platform != 'win32'" requirements.txt; then
            echo "::error::backend/requirements.txt has lost its environment markers (uvloop has no sys_platform marker). Regenerate with: uv pip compile requirements.in --generate-hashes --python-version 3.13 --universal --output-file requirements.txt"
            exit 1
          fi
          echo "requirements.txt markers present"
      - run: python -m compileall -q app
      - run: python -m unittest discover -s tests
      - run: python -c "import app.main; import app.worker"
        env:
          GEMINI_API_KEY: ci-test-key

  frontend:
    name: Frontend
    if: inputs.frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check Node version pins agree
        # /.nvmrc is the single source of truth for the Node major;
        # frontend/Dockerfile's digest-pinned `FROM node:` line (the `base`
        # stage) has to repeat it because a digest cannot be derived from a
        # version string. This is the only thing stopping the two from silently
        # diverging.
        working-directory: ${{ github.workspace }}
        run: |
          want="$(tr -d '[:space:]' < .nvmrc | sed 's/^v//')"
          got="$(sed -n 's/^FROM node:\([0-9]*\)-alpine@.*/\1/p' frontend/Dockerfile)"
          if [ "$want" != "$got" ]; then
            echo "::error::.nvmrc is '${want}' but frontend/Dockerfile has FROM node:'${got}'"
            exit 1
          fi
          echo "Node pin agrees: ${want}"
      - uses: ./.github/actions/setup-frontend
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm run build:mobile
