name: Reusable container checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  containers:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Check Dockerfile
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          call: check
          context: ./${{ matrix.service }}
      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          cache-from: type=gha,scope=check-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=check-${{ matrix.service }}
          context: ./${{ matrix.service }}
          load: true
          pull: true
          tags: videolens/${{ matrix.service }}:check
      - name: Scan fixable high and critical vulnerabilities
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          cache-db: true
          # Repo-root Grype config carrying documented, per-CVE exceptions.
          # Passed explicitly rather than relying on cwd auto-detection: Grype
          # hard-errors on a missing `-c` path but silently skips a config it
          # merely failed to auto-detect, so this makes a renamed or deleted
          # config a red job instead of a quietly widened gate.
          config: .grype.yaml
          fail-build: true
          image: videolens/${{ matrix.service }}:check
          only-fixed: true
          output-format: table
          severity-cutoff: high
