name: Reusable Android checks

# Single definition of the Android build. Called two ways:
#   development-environment.yml -> PRs into dev that touch frontend/:
#     dev_artifact true, the APK is built against the dev backend with the
#     `.dev` application id suffix and kept as a short-lived workflow artifact
#     for testing on a device. Never a release.
#   production-environment.yml  -> push to main, upload_apk true, then a
#     separate release job in that workflow consumes the artifact.
# This workflow never creates a tag or a release; it is capped at contents: read.

on:
  workflow_call:
    inputs:
      upload_apk:
        description: >-
          Build the production APK and upload it with the version manifest as
          a workflow artifact for a downstream release job. Release-signed
          (assembleRelease) when all four ANDROID_* secrets are set;
          debug-signed with the checked-in keystore, with a warning, when none
          are; fails when only some are.
        required: false
        default: false
        type: boolean
      dev_artifact:
        description: >-
          Keep the APK as a workflow artifact for testing (14 days), built
          with -PdevBuild=true so Gradle applies the `.dev` application id and
          `-dev` version name suffixes and it installs beside the production
          app. No version manifest, no release. Mutually exclusive with
          upload_apk.
        required: false
        default: false
        type: boolean
      api_base_url:
        description: >-
          Backend URL compiled into the APK as NEXT_PUBLIC_API_BASE_URL.
          Required whenever upload_apk or dev_artifact is true, because that
          APK reaches real devices.
        required: false
        default: ""
        type: string
      tag_prefix:
        description: >-
          Prefix for the release tag this build will be published under. Only
          used to write the releaseUrl into version.json, so the manifest the
          installed app reads points at a tag that actually exists. The caller
          publishing the release must use the release_tag output rather than
          rebuilding the string, or the two can drift apart.
        required: false
        default: "v"
        type: string
    secrets:
      # Release signing, used only when upload_apk is true. All four set:
      # the production APK is release-signed with this key. None set: it
      # falls back to the debug build signed with the checked-in keystore
      # (the pre-2026-11-07 behaviour) and warns. Some set: the job fails.
      ANDROID_KEYSTORE_BASE64:
        description: The release keystore (.jks / .keystore), base64-encoded
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false
    outputs:
      version_name:
        description: Application version name read from frontend/package.json
        value: ${{ jobs.android.outputs.version_name }}
      version_sha:
        description: Short commit SHA the APK was built from
        value: ${{ jobs.android.outputs.version_sha }}
      artifact_name:
        description: Name of the uploaded APK artifact, empty unless upload_apk is true
        value: ${{ jobs.android.outputs.artifact_name }}
      version_code:
        description: Android versionCode this APK was built with
        value: ${{ jobs.android.outputs.version_code }}
      release_tag:
        description: Tag the caller's release job must publish this APK under
        value: ${{ jobs.android.outputs.release_tag }}

permissions:
  contents: read

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    # Generous: green runs take well under 10 minutes. The cap exists so a hung
    # Gradle daemon costs 25 minutes, not GitHub's default 360.
    timeout-minutes: 25
    outputs:
      version_name: ${{ steps.version.outputs.name }}
      version_sha: ${{ steps.version.outputs.sha }}
      artifact_name: ${{ steps.version.outputs.artifact }}
      version_code: ${{ steps.version.outputs.code }}
      release_tag: ${{ steps.version.outputs.tag }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Validate build inputs
        shell: bash
        # Runs before checkout, so it cannot use the job's `frontend`
        # working-directory default — that path does not exist yet.
        working-directory: .
        env:
          API_BASE_URL: ${{ inputs.api_base_url }}
          UPLOAD_APK: ${{ inputs.upload_apk }}
          DEV_ARTIFACT: ${{ inputs.dev_artifact }}
        run: |
          if [ "$UPLOAD_APK" = "true" ] && [ "$DEV_ARTIFACT" = "true" ]; then
            echo "upload_apk and dev_artifact are mutually exclusive: a release APK must not carry the .dev suffix." >&2
            exit 1
          fi
          # Both failures below are silent at runtime, which is why they are
          # caught here instead: a missing backend URL falls back to
          # http://localhost:8000 (infrastructure/runsGateway.ts) - on a phone
          # that is the phone - and a missing web URL makes updateCheck.ts
          # no-op, so the app can never tell the user a newer build exists.
          # Neither turns CI red on its own; the APK builds perfectly either way.
          if [ "$UPLOAD_APK" = "true" ] || [ "$DEV_ARTIFACT" = "true" ]; then
            test -n "$API_BASE_URL" || {
              echo "api_base_url is required when upload_apk or dev_artifact is true: this APK is installed on real devices and must know where the backend lives." >&2
              exit 1
            }
          fi
      # Picks how the production APK is signed. Release signing with a key that
      # lives only in CI secrets is the goal: the checked-in debug keystore
      # (password "android") lets anyone with the repository build an APK that
      # installs as an update over the real one, and the debug build ships
      # debuggable. The owner deferred creating that key (2026-11-07), so:
      #   all four secrets set -> variant=release, assembleRelease, signed
      #   none set             -> variant=debug, assembleDebug with the
      #                           checked-in keystore and no -PdevBuild, i.e.
      #                           what production shipped before 2026-11-07;
      #                           warns in the log and the step summary
      #   some set             -> fail: that is a misconfiguration
      # Values are only tested for emptiness here, never printed.
      - name: Prepare release signing
        id: signing
        if: inputs.upload_apk
        shell: bash
        working-directory: .
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          present=()
          missing=()
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -n "${!name}" ]; then present+=("ANDROID_${name}"); else missing+=("ANDROID_${name}"); fi
          done
          if [ "${#present[@]}" -eq 0 ]; then
            msg="Production APK is debug-signed: release keystore not configured (DEPLOYMENT.md → Android release signing)"
            echo "::warning::${msg}"
            echo "- :warning: ${msg}" >> "$GITHUB_STEP_SUMMARY"
            echo "variant=debug" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Release signing is partly configured. Set: ${present[*]}. Missing: ${missing[*]}. Set all four or none; see DEPLOYMENT.md, 'Android release signing'." >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "${RUNNER_TEMP}/release.keystore"
          test -s "${RUNNER_TEMP}/release.keystore" || { echo "::error::ANDROID_KEYSTORE_BASE64 did not decode to a keystore." >&2; exit 1; }
          echo "variant=release" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # versionCode is the commit count below, which is 1 at the default
          # fetch-depth of 1 - every build would claim to be version 1.
          fetch-depth: 0
      - uses: ./.github/actions/setup-frontend
      - uses: ./.github/actions/setup-android
      # `android:sync` runs `build:mobile`, and Next inlines NEXT_PUBLIC_* at
      # build time — so this value is baked into the static export the APK
      # ships, not read at runtime. It has to be set here, or the APK is
      # permanently pointed at whatever the fallback is.
      - run: npm run android:sync
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ inputs.api_base_url }}
      - id: version
        env:
          TAG_PREFIX: ${{ inputs.tag_prefix }}
          # release for a release-signed production APK; debug for the
          # debug-signed production fallback, the dev artifact and the plain
          # gate (the signing step is skipped there, so its output is empty).
          # Drives the Gradle task, the output directory and the artifact name.
          VARIANT: ${{ steps.signing.outputs.variant || 'debug' }}
        run: |
          name="$(node -p "require('./package.json').version")"
          sha="$(git rev-parse --short HEAD)"
          code="$(git rev-list --count HEAD)"
          {
            echo "name=${name}"
            echo "sha=${sha}"
            echo "code=${code}"
            echo "variant=${VARIANT}"
            echo "tag=${TAG_PREFIX}${name}-build${code}"
            echo "artifact=videolens-ai-v${name}-code${code}-${sha}-${VARIANT}"
          } >> "$GITHUB_OUTPUT"
      # Values reach Gradle through the environment, never interpolated into
      # the command line, so a version string with shell metacharacters cannot
      # run anything. The signing variables are empty unless the signing step
      # chose the release variant; build.gradle configures release signing
      # only when all four are present, and the debug build never reads them.
      - env:
          APP_VERSION_NAME: ${{ steps.version.outputs.name }}
          APP_VERSION_CODE: ${{ steps.version.outputs.code }}
          BUILD_REF: ${{ steps.version.outputs.sha }}
          VARIANT: ${{ steps.version.outputs.variant }}
          DEV_BUILD: ${{ inputs.dev_artifact }}
          ANDROID_KEYSTORE_PATH: ${{ steps.version.outputs.variant == 'release' && format('{0}/release.keystore', runner.temp) || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ steps.version.outputs.variant == 'release' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ANDROID_KEY_ALIAS: ${{ steps.version.outputs.variant == 'release' && secrets.ANDROID_KEY_ALIAS || '' }}
          ANDROID_KEY_PASSWORD: ${{ steps.version.outputs.variant == 'release' && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: |
          case "$VARIANT" in
            release) assemble=assembleRelease ;;
            *) assemble=assembleDebug ;;
          esac
          dev_flag=""
          if [ "$DEV_BUILD" = "true" ]; then dev_flag="-PdevBuild=true"; fi
          # shellcheck disable=SC2086 # dev_flag is empty or one fixed flag
          ./gradlew "$assemble" testDebugUnitTest \
            "-PappVersionName=${APP_VERSION_NAME}" \
            "-PappVersionCode=${APP_VERSION_CODE}" \
            "-PbuildRef=${BUILD_REF}" \
            $dev_flag
        working-directory: frontend/android
      - name: Write version manifest
        if: inputs.upload_apk
        env:
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          COMMIT: ${{ steps.version.outputs.sha }}
          RELEASE_URL: https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.tag }}
          VARIANT: ${{ steps.version.outputs.variant }}
        run: |
          node -e '
            const fs = require("node:fs");
            const out = "android/app/build/outputs/apk/" + process.env.VARIANT + "/version.json";
            fs.writeFileSync(out, JSON.stringify({
              versionCode: Number(process.env.VERSION_CODE),
              versionName: process.env.VERSION_NAME,
              commit: process.env.COMMIT,
              releaseUrl: process.env.RELEASE_URL,
            }, null, 2) + "\n");
          '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.upload_apk
        with:
          name: ${{ steps.version.outputs.artifact }}
          # release/ or debug/, whichever variant the signing step chose.
          path: |
            frontend/android/app/build/outputs/apk/${{ steps.version.outputs.variant }}/*.apk
            frontend/android/app/build/outputs/apk/${{ steps.version.outputs.variant }}/version.json
          if-no-files-found: error
          retention-days: 30
      # The dev/testing APK. Short retention, no manifest, never a release:
      # it exists so a PR's change can be installed on a phone beside the
      # production app, nothing more.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.dev_artifact
        with:
          name: videolens-ai-dev-v${{ steps.version.outputs.name }}-code${{ steps.version.outputs.code }}-${{ steps.version.outputs.sha }}
          path: frontend/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
