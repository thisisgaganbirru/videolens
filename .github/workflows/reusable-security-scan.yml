name: Reusable security scan

# Dockerfile check, native image build and Grype scan for fixable high and
# critical vulnerabilities. One definition, three callers:
#   production-environment.yml   -> PRs into main, enforce: true (a finding
#     fails the job, so the promotion cannot merge)
#   development-environment.yml  -> PRs into dev, enforce: false
#   security-nightly-scan.yml    -> main on a schedule, enforce: false,
#     build_failure_is_warning: true
#
# Advisory mode (enforce: false) must finish green. Railway's Wait for CI skips
# a deploy when ANY workflow on the commit failed, so a red advisory scan would
# silently block the dev deploy (or, for the nightly run on main, a production
# redeploy). Findings are reported through a warning, the job summary and a
# `security-findings-<service>` artifact instead.
#
# build_failure_is_warning (nightly only) goes one step further: a failed
# Dockerfile check or image build (a base-image pull, an apt mirror, a
# registry outage) becomes a warning and a green job, because the nightly run
# attaches to main's head and nothing is being merged. The scan is then
# skipped, and a `<service>.incomplete` marker goes into the same artifact so
# the nightly issue job does not mistake "no findings" for a clean scan. The
# dev lane leaves it off: there the build step is the only pre-merge proof
# that a Dockerfile still builds, so a broken build stays red.

on:
  workflow_call:
    inputs:
      enforce:
        description: Fail the job on findings. false reports them and stays green.
        required: true
        type: boolean
      services:
        description: JSON list of images to scan, a subset of ["backend","frontend"].
        required: false
        default: '["backend","frontend"]'
        type: string
      build_failure_is_warning:
        description: >-
          Advisory only (ignored when enforce is true). A failed Dockerfile
          check or image build warns and leaves the job green instead of
          failing it; the scan is skipped and marked incomplete.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  scan:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(inputs.services) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Check Dockerfile
        id: check
        continue-on-error: ${{ !inputs.enforce && inputs.build_failure_is_warning }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          call: check
          context: ./${{ matrix.service }}
      - name: Build image
        id: build
        # Skipped (not run) after a tolerated check failure; see the header.
        if: ${{ steps.check.outcome == 'success' }}
        continue-on-error: ${{ !inputs.enforce && inputs.build_failure_is_warning }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          # This image is scanned and thrown away, never deployed. A blank
          # backend URL is refused by frontend/next.config.mjs outside CI (and
          # a Docker build does not see the runner's CI=true), so the frontend
          # gets a placeholder on the reserved, never-resolving `.invalid`
          # TLD (RFC 2606). Real builds (Railway, GHCR publish) pass their own.
          build-args: ${{ matrix.service == 'frontend' && 'NEXT_PUBLIC_API_BASE_URL=https://scan-placeholder.invalid' || '' }}
          cache-from: type=gha,scope=check-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=check-${{ matrix.service }}
          context: ./${{ matrix.service }}
          # Always rebuild the final stage. Its OS-package upgrade layer
          # (`apt-get upgrade` in backend `runtime`, `apk add --upgrade` in
          # frontend `runner`) is keyed only on the base digest and command
          # text, so a cache hit silently skips new distro security fixes and
          # the scan below gates on a stale layer. Earlier stages stay cached.
          # Stage names must match the `AS` names in each Dockerfile, and must
          # stay identical to reusable-container-publish.yml so the image that
          # is published is built the same way as the one scanned here.
          no-cache-filters: ${{ matrix.service == 'backend' && 'runtime' || 'runner' }}
          load: true
          pull: true
          tags: videolens/${{ matrix.service }}:check
      - name: Scan fixable high and critical vulnerabilities
        id: scan
        # Only a tolerated build failure (build_failure_is_warning) gets here
        # without an image; every other failure has already ended the job.
        if: ${{ steps.build.outcome == 'success' }}
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        # The gate itself never changes between modes: fail-build, only-fixed
        # and severity-cutoff stay as they are. Advisory mode only stops a
        # failed scan from failing the job.
        continue-on-error: ${{ !inputs.enforce }}
        with:
          cache-db: true
          # Repo-root Grype config carrying documented, per-CVE exceptions.
          # Passed explicitly rather than relying on cwd auto-detection: Grype
          # hard-errors on a missing `-c` path but silently skips a config it
          # merely failed to auto-detect, so this makes a renamed or deleted
          # config a red job instead of a quietly widened gate.
          config: .grype.yaml
          fail-build: true
          image: videolens/${{ matrix.service }}:check
          only-fixed: true
          output-format: table
          severity-cutoff: high
      - name: Report an incomplete scan
        if: ${{ !inputs.enforce && inputs.build_failure_is_warning && (steps.check.outcome == 'failure' || steps.build.outcome == 'failure') }}
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          msg="The ${SERVICE} image did not build (Dockerfile check or image build failed, often a base-image pull or package mirror), so it was not scanned. Advisory here; see the failed step's log."
          echo "::warning title=Security scan incomplete (${SERVICE})::${msg}"
          {
            echo "### Security scan incomplete: ${SERVICE}"
            echo
            echo "${msg}"
          } >> "$GITHUB_STEP_SUMMARY"
          mkdir -p security-findings
          echo "${msg}" > "security-findings/${SERVICE}.incomplete"
      - name: Report advisory findings
        if: ${{ !inputs.enforce && steps.scan.outcome == 'failure' }}
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          msg="Fixable high/critical vulnerabilities in the ${SERVICE} image. Advisory here; the production promotion will fail on them. See the scan step's log for the table."
          echo "::warning title=Security scan (${SERVICE})::${msg}"
          {
            echo "### Security findings: ${SERVICE}"
            echo
            echo "${msg}"
          } >> "$GITHUB_STEP_SUMMARY"
          mkdir -p security-findings
          echo "${msg}" > "security-findings/${SERVICE}.txt"
      - name: Upload advisory findings
        if: ${{ !inputs.enforce && (steps.scan.outcome == 'failure' || (inputs.build_failure_is_warning && (steps.check.outcome == 'failure' || steps.build.outcome == 'failure'))) }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-findings-${{ matrix.service }}
          path: security-findings/
          retention-days: 7
