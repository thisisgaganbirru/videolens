name: Development environment

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: dev-environment
  cancel-in-progress: true

jobs:
  application:
    if: github.ref == 'refs/heads/dev'
    uses: ./.github/workflows/reusable-application-checks.yml
  containers:
    if: github.ref == 'refs/heads/dev'
    uses: ./.github/workflows/reusable-container-checks.yml
  # Gate only. dev builds the APK to prove it still compiles, then throws it
  # away: releases are published from main, so nothing here reaches a device.
  android:
    if: github.ref == 'refs/heads/dev'
    uses: ./.github/workflows/reusable-android-checks.yml
  publish:
    if: github.ref == 'refs/heads/dev'
    needs: [application, containers]
    uses: ./.github/workflows/reusable-container-publish.yml
    with:
      environment: dev
      channel: dev
      revision: ${{ github.sha }}
      api_base_url: https://videolens-backend-dev.up.railway.app
    secrets: inherit
