name: Security nightly scan

# Scans main every morning so a newly published CVE shows up as an issue,
# instead of being discovered when every open PR turns red at once.
#
# A scheduled run starts from the default branch, which is dev since
# 2026-11-26, so the scan checks out main explicitly (`ref: main`); without it
# the "scan of main" would scan dev. The run itself still attaches to the
# default branch's head commit (and a manual run to the branch it is started
# on).
#
# It must never fail on findings. Railway's Wait for CI skips any deploy -
# including the redeploy a variable change triggers - while a workflow on the
# commit is red, and the commit this run attaches to is a deployed branch's
# head. So the scan runs in advisory mode, a failed image build (base pull,
# mirror outage) is a warning rather than a red job
# (build_failure_is_warning), and the issue job cannot fail the run.

on:
  schedule:
    # 06:17 UTC, off the top of the hour when scheduled runs queue up.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-nightly-scan
  cancel-in-progress: true

jobs:
  scan:
    uses: ./.github/workflows/reusable-security-scan.yml
    with:
      enforce: false
      build_failure_is_warning: true
      ref: main

  issue:
    name: Report findings
    needs: scan
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Reporting is best-effort; it must not turn the run red (see above).
    continue-on-error: true
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TITLE: "Security scan: fixable high/critical vulnerabilities on main"
      INCOMPLETE_TITLE: "Security scan: the nightly scan of main could not run"
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        # No findings means no artifacts; that must not stop the step below,
        # which is also what closes the issue after a clean run.
        continue-on-error: true
        with:
          pattern: security-findings-*
          path: findings
          merge-multiple: true
      - name: Open, update or close the tracking issue
        shell: bash
        env:
          SCAN_RESULT: ${{ needs.scan.result }}
        run: |
          existing="$(gh issue list --state open --search "in:title \"${TITLE}\"" --json number --jq '.[0].number // empty')"
          incomplete="$(gh issue list --state open --search "in:title \"${INCOMPLETE_TITLE}\"" --json number --jq '.[0].number // empty')"
          # A scan that keeps failing to build would otherwise only ever be a
          # warning. Track it in its own issue (opened once, commented on each
          # failed night, closed by the next complete scan); never fail.
          if compgen -G "findings/*.incomplete" >/dev/null || [ "$SCAN_RESULT" != "success" ]; then
            # shellcheck disable=SC2016 # the backticks are Markdown in the issue body, not command substitution
            note="$(printf 'The nightly scan of `main` did not scan every image (scan job: %s). An image build or the scanner failed, so new vulnerabilities may be going unnoticed. Details: %s\n\nThis issue is updated by `security-nightly-scan.yml` and closed automatically after a complete scan.' "$SCAN_RESULT" "$RUN_URL")"
            if [ -n "$incomplete" ]; then
              gh issue comment "$incomplete" --body "$note" || echo "::warning::Could not comment on issue #${incomplete}."
            else
              gh issue create --title "$INCOMPLETE_TITLE" --body "$note" || echo "::warning::Could not open the scan-could-not-run issue."
            fi
          elif [ -n "$incomplete" ]; then
            gh issue close "$incomplete" --comment "Complete nightly scan: ${RUN_URL}" || true
          fi
          if compgen -G "findings/*.txt" >/dev/null; then
            services="$(for f in findings/*.txt; do basename "$f" .txt; done | paste -sd, -)"
            # shellcheck disable=SC2016 # the backticks are Markdown in the issue body, not command substitution
            body="$(printf 'The nightly scan of `main` found fixable high or critical vulnerabilities in: **%s**.\n\nThe next promotion into `main` will fail its enforced scan until these are fixed. The table is in the scan step log of %s.\n\nThis issue is updated by `security-nightly-scan.yml` and closed automatically after a clean run.' "$services" "$RUN_URL")"
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --body "$body"
            else
              gh issue create --title "$TITLE" --body "$body"
            fi
          elif compgen -G "findings/*.incomplete" >/dev/null; then
            # An image did not build, so it was not scanned (the scan job
            # stays green for that, see reusable-security-scan.yml). No
            # findings proves nothing; leave the issue as it is.
            echo "::warning::At least one image was not scanned; not treating this run as clean."
          elif [ "$SCAN_RESULT" != "success" ]; then
            # The scan itself broke (a build failure, not a finding), so the
            # absence of findings proves nothing. Leave the issue as it is.
            echo "::warning::The scan job ended '${SCAN_RESULT}'; not treating this run as clean."
          else
            echo "No findings."
            if [ -n "$existing" ]; then
              gh issue close "$existing" --comment "Clean nightly scan: ${RUN_URL}"
            fi
          fi
