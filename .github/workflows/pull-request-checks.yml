name: Pull request checks

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  application:
    uses: ./.github/workflows/reusable-application-checks.yml
  containers:
    uses: ./.github/workflows/reusable-container-checks.yml
  android:
    uses: ./.github/workflows/reusable-android-checks.yml
