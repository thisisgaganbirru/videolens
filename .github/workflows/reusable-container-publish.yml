name: Reusable container publication

# Build once, scan that exact image, then promote it. The multi-platform image
# is pushed under its immutable `sha-<revision>` tag only; Grype then scans the
# pushed image (a hard gate, no advisory mode here); only if it passes does the
# mutable channel tag (`latest`) move to it, by copying the index with
# `imagetools create` rather than rebuilding. The scanned image and the
# published image are therefore the same digest.
#
# A failed scan leaves the `sha-` tag behind as an unpromoted candidate.
# Nothing pulls `sha-` tags automatically and Railway builds from source, so
# this is inert; it also keeps the failing image inspectable.

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment that protects this publication
        required: true
        type: string
      channel:
        description: Mutable environment tag the scanned image is promoted to, such as latest
        required: true
        type: string
      revision:
        description: Full commit SHA used for the immutable tag and OCI label
        required: true
        type: string
      api_base_url:
        description: Public backend URL compiled into the frontend image
        required: false
        default: ""
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: ${{ matrix.service }} / ${{ inputs.environment }}
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    env:
      API_BASE_URL: ${{ inputs.api_base_url || vars.PRODUCTION_API_BASE_URL }}
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    steps:
      - name: Validate publication inputs
        shell: bash
        env:
          CHANNEL: ${{ inputs.channel }}
          ENVIRONMENT: ${{ inputs.environment }}
          REVISION: ${{ inputs.revision }}
          SERVICE: ${{ matrix.service }}
        run: |
          test -n "$CHANNEL" || { echo "channel is required" >&2; exit 1; }
          test -n "$REVISION" || { echo "revision is required" >&2; exit 1; }
          # Only the frontend image compiles a backend URL in. Requiring it for
          # the backend leg would let a missing production variable block an
          # image that has no use for it.
          if [ "$SERVICE" = "frontend" ]; then
            test -n "$API_BASE_URL" || {
              echo "api_base_url is required to publish the frontend image: pass it from the calling workflow, or define PRODUCTION_API_BASE_URL in the '${ENVIRONMENT}' GitHub environment." >&2
              exit 1
            }
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.revision }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # provenance and sbom below are BuildKit --attest shorthands. They attach
      # in-toto attestation manifests to the image index in GHCR itself; they are
      # not Sigstore-signed and emit nothing to any public log. Keyless Cosign
      # signing was deliberately removed - it wrote a permanent, undeletable
      # Rekor transparency-log entry, and it cannot be kept without that log
      # because the short-lived Fulcio certificate is only verifiable through it.
      - name: Build and publish multi-platform image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          build-args: ${{ matrix.service == 'frontend' && format('NEXT_PUBLIC_API_BASE_URL={0}', env.API_BASE_URL) || '' }}
          cache-from: type=gha,scope=publish-${{ inputs.environment }}-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=publish-${{ inputs.environment }}-${{ matrix.service }}
          context: ./${{ matrix.service }}
          # Same final-stage cache bypass as reusable-security-scan.yml:
          # without it the GHA cache would restore an old OS-package upgrade
          # layer and ship an image missing fixes the scan build picked up.
          no-cache-filters: ${{ matrix.service == 'backend' && 'runtime' || 'runner' }}
          labels: |
            org.opencontainers.image.revision=${{ inputs.revision }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          pull: true
          push: true
          sbom: true
          # The candidate tag only. The channel tag is added below, after the
          # scan, so `latest` can never point at an unscanned image.
          tags: ghcr.io/${{ github.repository }}/videolens-${{ matrix.service }}:sha-${{ inputs.revision }}
      - name: Scan the pushed image for fixable high and critical vulnerabilities
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          cache-db: true
          # Same gate and exception list as reusable-security-scan.yml. Grype
          # pulls with the GHCR login above and scans the runner's platform
          # (linux/amd64) of the index; the arm64 variant is built from the
          # same Dockerfile and package pins.
          config: .grype.yaml
          fail-build: true
          image: ghcr.io/${{ github.repository }}/videolens-${{ matrix.service }}@${{ steps.build.outputs.digest }}
          only-fixed: true
          output-format: table
          severity-cutoff: high
      - name: Promote the scanned image to the channel tag
        env:
          IMAGE: ghcr.io/${{ github.repository }}/videolens-${{ matrix.service }}
          CHANNEL: ${{ inputs.channel }}
          DIGEST: ${{ steps.build.outputs.digest }}
        # Copies the whole index (both platforms plus the SBOM and provenance
        # attestations) to the new tag without rebuilding anything.
        run: docker buildx imagetools create --tag "${IMAGE}:${CHANNEL}" "${IMAGE}@${DIGEST}"
      - name: Report published digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ghcr.io/${{ github.repository }}/videolens-${{ matrix.service }}
          CHANNEL: ${{ inputs.channel }}
        run: echo "Published ${IMAGE}@${DIGEST} as sha-${{ inputs.revision }} and ${CHANNEL}" >> "$GITHUB_STEP_SUMMARY"
