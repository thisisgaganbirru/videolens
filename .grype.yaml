# Grype configuration for the CI container vulnerability gate.
#
# Consumed by the "Scan fixable high and critical vulnerabilities" step in
# .github/workflows/reusable-container-checks.yml, which passes this file
# explicitly through the scan action's `config` input. The path is repo root
# because that is the checkout root ($GITHUB_WORKSPACE) and therefore Grype's
# working directory.
#
# The gate itself is NOT configured here. `severity-cutoff: high`,
# `only-fixed: true` and `fail-build: true` stay in the workflow and must not
# be weakened. This file carries only narrowly-scoped, documented, temporary
# exceptions. Lowering the cutoff instead of writing an entry here would trade
# one known low-risk finding for a permanent blind spot across both images.
#
# Grype ANDs every criterion in a rule, so each entry below must suppress
# exactly one CVE on exactly one package of one type, and nothing else. Every
# entry needs: the CVE, package name AND type, the date added, who approved
# it, why no fix can be shipped, measured risk, and an explicit removal
# condition. See docs/container-workflows.md, "The vulnerability gate".
#
# There are currently NO exceptions. The last one, CVE-2026-15308 on the
# `python` binary, was removed on 2026-10-02: the backend base image is now
# CPython 3.13.16, and the Grype DB's NVD range for the 3.13 line is
# `>= 3.13.0, < 3.13.15`, so the rule no longer matched anything.
#
# Keep this file even while empty: the scan step passes it via `config:`, and
# Grype hard-errors on a missing `-c` path - which is the point.

ignore: []
